[package]
name = "examples"
edition = { workspace = true }
publish = false

[[bin]]
name = "datafusion-local"
path = "datafusion-local.rs"

[[bin]]
name = "datafusion-client-server"
path = "datafusion-client-server.rs"

[[bin]]
name = "core"
path = "core.rs"

[dependencies]
arrow = { workspace = true }
datafusion = { workspace = true }
liquid-cache = { workspace = true }
liquid-cache-datafusion-server = { workspace = true }
liquid-cache-datafusion-client = { workspace = true }
liquid-cache-datafusion-local = { workspace = true }
tokio = { workspace = true }
arrow-flight = { workspace = true }
tonic = { workspace = true }
url = { workspace = true }
tempfile = "3.27.0"
clap = { version = "4.6.1", features = ["derive"] }
object_store = { workspace = true, features = ["http"] }
