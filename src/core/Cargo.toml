serde_json = { workspace = true }
mimalloc = "0.1.52"
clap = { version = "4.6.1", features = ["derive"] }
divan = "0.1.21"
insta = { workspace = true }
datafusion = { workspace = true }

[features]
shuttle = ["t4/shuttle"]

[[bench]]
name = "cache_storage"
path = "study/cache_storage.rs"
harness = false
